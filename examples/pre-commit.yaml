parameters:
  - name: enableDebug
    displayName: 'Enable debug'
    type: boolean
    default: true

  - name: operatingSystem
    displayName: 'Operating system'
    type: string
    default: 'ubuntu'
    values:
      - windows
      - ubuntu
      - macOS

  - name: commitMessageFormat
    displayName: 'Commit message format'
    type: string
    default: 'inline'

steps:
  - task: message-body
    name: CommitMessageBody
    displayName: 'Set commit message'
    enabled: true
    continueOnError: false
    inputs:
      requireBlankLine: ${{ parameters.requireBodyBlankLine }}
      maxLineLength: ${{ parameters.bodyMaxLineLength }}

  - task: Bash@3
    displayName: ${{ parameters.commitMessageFormat }}
    inputs:
      targetType: 'inline'
      script: |
        echo "##vso[task.setvariable variable=commitFormat]%s%n%b"

  - pwsh: |
      Write-Host "Commit message"
      Write-Host "##vso[task.setvariable variable=commitFormat]$($env:commitFormat)"
    displayName: 'Set commit message (PowerShell)'
